# pnpm 11 refuses to finish an install while a dependency's build script is
# neither allowed nor denied, so these have to be real booleans - the scaffold
# it writes leaves them as placeholder strings, which reads as "not allowed"
# and exits 1 before Next.js is ever reached.
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@yummacss/canon@3.31.0'
  - '@yummacss/core@3.31.0'
  - '@yummacss/nitro@3.31.0'
  - '@yummacss/postcss@3.31.0'
  - yummacss@3.31.0
